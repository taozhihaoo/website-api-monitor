[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitewatch-backend"
version = "1.0.0"
description = "SiteWatch - website & API monitoring platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    # Pinned: ruff adds rules in minor releases; unpinned CI would break spontaneously.
    "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixed basetemp: avoids Windows symlink permission errors in the default
# pytest-of-<user> temp layout, and keeps scheduler file-DB tests local.
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in parameter defaults is the canonical FastAPI DI pattern.
"app/api/**" = ["B008"]
