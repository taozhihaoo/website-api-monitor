name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitewatch
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: sitewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-real-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://sitewatch:test-password@localhost:5432/sitewatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff — app, tests and migrations)
        working-directory: backend
        run: ruff check app tests alembic
      - name: Migrations round-trip (upgrade → downgrade → upgrade)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check (also validates en/zh dictionary parity)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate bilingual READMEs and localized screenshots
        run: python scripts/check_docs.py

  # The compose path used to be unverified. This job builds both images, boots
  # the real stack (Postgres + backend + nginx) and exercises the routes that
  # only exist behind the proxy. POSTGRES_PASSWORD deliberately contains URL
  # delimiters to guard the connection-string encoding regression.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-compose-secret-key-not-real-0123456789abcdef
      POSTGRES_PASSWORD: "p@ss:w0rd#1"
      POSTGRES_USER: sitewatch
      POSTGRES_DB: sitewatch
      FRONTEND_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config -q
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Smoke-test the proxied routes
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "backend healthy after ${attempt} attempt(s)"
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8080/health | grep -q '"status"'
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/openapi.json | grep -q '"openapi"'
          curl -fsS http://localhost:8080/docs | grep -q 'swagger-ui'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e .
      - name: Install frontend + Playwright browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: "Run E2E (real stack: uvicorn + vite + database)"
        working-directory: frontend
        run: npx playwright test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
